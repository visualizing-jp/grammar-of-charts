<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チャートの文法</title>
<meta name="description" content="チャートを、背景（スペース変換）と前景（ビジュアル変換）の重なりとして読み解く教材。">
<style>
:root{
  /* layout: one fixed 16:9 screen. Stage on the left (7), controls on the right (3), scene steps along the bottom. */
  --paper:#ffffff;
  --tile:#eef0f2;
  --ink:#1b1c22;
  --ink-2:#5c606b;
  --rule:#d3d6db;
  --navy:#3f4257;
  --accent:#1487d8;
  --pink:#e23a97;
  --c-disease:#257de0;
  --c-wounds:#ec4647;
  --c-other:#4a4a4a;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;font-size:clamp(13px,1.15vw,24px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.top{display:flex;align-items:baseline;gap:1.4rem;padding:.85rem 1.6rem .7rem;border-bottom:1px solid var(--rule)}
.brand{font-size:.85rem;font-weight:700;color:var(--ink-2);white-space:nowrap;background:none;border:0;padding:0}
.caption{margin:0;font-size:1.7rem;font-weight:800;line-height:1.25;text-wrap:balance}
.caption .no{color:var(--accent);margin-right:.55em;font-variant-numeric:tabular-nums}

.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);min-height:0}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;padding:.7rem 1rem .5rem 1.6rem}
.stagehead{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;min-height:2.3rem}
.stagehead h2{margin:0;font-size:1.45rem;font-weight:800}
.stagehead p{margin:0;font-size:.85rem;color:var(--ink-2)}
.svgbox{flex:1;min-height:0;position:relative}
.svgbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.panel{background:var(--tile);padding:1.1rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:1rem;min-height:0;overflow:auto}
.panel h3{margin:0 0 .45rem;font-size:.85rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:.5rem}
.panel h3 svg{width:1.7rem;height:1.7rem;flex:none}
.panel h3 b{color:var(--ink);font-size:1rem}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.tile{aspect-ratio:1;background:var(--paper);border:2px solid transparent;border-radius:.4rem;padding:.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-width:0;overflow:hidden}
.tile svg{flex:1 1 0;min-height:0;width:100%;display:block}
.tile span{font-size:.72rem;line-height:1.2;color:var(--ink);font-weight:600;text-align:center;text-wrap:balance}
.tile:hover{border-color:var(--rule)}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile[aria-pressed="true"] span{color:var(--ink);font-weight:700}

/* the action button: same box as a data-name button (half the panel wide), filled so it reads as the thing to press */
.seg .act{border:2px solid var(--navy);border-radius:.4rem;background:var(--navy);color:#fff;padding:.5rem .3rem;font-size:.95rem;font-weight:700;line-height:1.4;display:flex;align-items:center;justify-content:center;gap:.3rem;white-space:nowrap;min-width:0}
.seg .act svg{width:1.4em;height:1em;flex:none;display:block}
.seg .act:hover{background:#2f3246;border-color:#2f3246}
.big{border:0;border-radius:.5rem;background:var(--navy);color:#fff;font-size:1.35rem;font-weight:800;padding:.85rem 1rem;display:flex;justify-content:center;align-items:baseline;gap:.8rem}
.big kbd{font:inherit;font-size:.7rem;font-weight:600;opacity:.7;border:1px solid currentColor;border-radius:.25rem;padding:.05rem .4rem}
.big:hover{background:#2f3246}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.seg button{border:2px solid transparent;background:var(--paper);border-radius:.4rem;padding:.5rem .4rem;font-size:.95rem;font-weight:700;line-height:1.4}
.seg button[aria-pressed="true"]{border-color:var(--accent)}
.coord button{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding:.5rem .4rem .55rem;font-size:1.05rem;min-width:0;overflow:hidden}
.coord button svg{flex:1 1 0;min-height:0;width:100%;max-width:62%}
.coord button small{font-size:.75rem;font-weight:500;color:var(--ink-2)}
/* slider: a point on a line, with no filled span from the minimum */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.8rem;margin:.2rem 0 0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#9aa0aa;border-radius:1px}
input[type=range]::-moz-range-track{height:2px;background:#9aa0aa;border-radius:1px}
input[type=range]::-moz-range-progress{background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--accent);border:3px solid var(--tile);margin-top:calc(1px - .55rem)}
input[type=range]::-moz-range-thumb{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--accent);border:3px solid var(--tile);box-sizing:border-box}

.legend{display:flex;flex-wrap:wrap;gap:.4rem .5rem;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:.4rem;font-size:.9rem}
.legend i{width:1rem;height:1rem;border-radius:.15rem;display:block}
.chip{border:2px solid transparent;background:var(--paper);border-radius:2rem;padding:.22rem .7rem;font-size:.8rem}
.chip[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.note{margin:0;font-size:.78rem;line-height:1.5;color:var(--ink-2)}

.foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 1.6rem;border-top:1px solid var(--rule)}
.steps{display:flex;gap:.3rem;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.steps button{border:0;background:none;border-radius:2rem;padding:.3rem .8rem;font-size:.82rem;display:flex;gap:.45rem;align-items:baseline}
.steps button b{font-variant-numeric:tabular-nums}
.steps button[aria-current="step"]{background:var(--navy);color:#fff;font-weight:700}
.steps button:disabled{color:#a3a7b0;cursor:default}
.keys{font-size:.72rem;color:var(--ink-2);display:flex;gap:1rem;flex-wrap:wrap;justify-content:flex-end}
.keys kbd{font:inherit;border:1px solid var(--rule);border-radius:.25rem;padding:0 .35rem;margin-right:.3rem;color:var(--ink)}

#tip{position:fixed;left:0;top:0;z-index:10;pointer-events:none;background:var(--ink);color:#fff;border-radius:.35rem;padding:.4rem .6rem;font-size:.8rem;line-height:1.45;display:flex;flex-direction:column;max-width:22rem}
#tip b{font-weight:700}

/* SVG text and marks */
svg text{font-family:var(--font);fill:var(--ink)}
.t-tag{font-size:15px;fill:var(--ink-2);font-weight:600}
.t-big{font-size:32px;font-weight:800}
.t-res{font-size:30px;font-weight:800}
.t-op{font-size:30px;font-weight:700;fill:var(--ink-2)}
.t-ax{font-size:14px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.t-axl{font-size:16px;font-weight:700}
.layer{filter:drop-shadow(0 10px 12px rgba(27,28,34,.10))}
.wedge{stroke:var(--paper);stroke-width:1.6;stroke-linejoin:round}
.wedge:hover{filter:brightness(1.12)}
.ring{fill:none;stroke:#dfe2e6;stroke-width:1}
.base{fill:none;stroke:#9aa0aa;stroke-width:1.5}
.yl{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.3}
.yl.dim{opacity:.1}
.yl.on{stroke:var(--accent);stroke-width:2.4;opacity:.95}
.yl.hot{stroke:var(--pink);stroke-width:3;opacity:1}
.yhit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke}

/* cover */
.app.is-cover .top,.app.is-cover .foot{display:none}
.app.is-cover{grid-template-rows:minmax(0,1fr)}
.cover{position:relative;background:var(--navy);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:2rem;padding:3rem 4.5rem;min-height:0}
.cover .org{position:absolute;left:4.5rem;top:2.6rem;margin:0;font-size:.95rem;font-weight:700;letter-spacing:.05em;color:#c9cbe0}
.cover h1{margin:0;font-size:4.4rem;font-weight:800;line-height:1.15;letter-spacing:.02em}
.cover .eq{margin:1.1rem 0 2.6rem;font-size:1.5rem;font-weight:500;color:#c9cbe0}
.cover .eq b{color:#fff;font-weight:800}
.start{border:0;border-radius:2rem;background:#fff;color:var(--navy);font-size:1.15rem;font-weight:800;padding:.7rem 1.6rem;display:inline-flex;align-items:baseline;gap:.7rem}
.start kbd{font:inherit;font-size:.7rem;font-weight:600;opacity:.6;border:1px solid currentColor;border-radius:.25rem;padding:.05rem .4rem}
.start:focus-visible{outline-color:#fff}
.cover .art svg{display:block;width:100%;height:auto;max-height:72vh}
.cover .sheet{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.45)}
.cover [stroke="var(--ink)"]{stroke:#fff}
.cover [fill="var(--ink)"]{fill:#fff}
.cover [stroke="#b6bac3"]{stroke:rgba(255,255,255,.4)}
.cover .cfg [fill="var(--ink)"]{fill:var(--pink)}
.cover .float{animation:coverA 5s ease-in-out infinite alternate}
.cover .float.b{animation-name:coverB}
@keyframes coverA{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes coverB{from{transform:translateY(0)}to{transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.cover .float{animation:none}}

/* scenes 1-3 */
.t-sub{font-size:15px;fill:var(--ink-2)}
.t-link{font-size:15px;font-weight:700;fill:var(--ink-2);text-decoration:underline;cursor:pointer}
.t-link:hover{fill:var(--ink)}
.lab-fg .sw{fill:var(--accent)}
.lab-bg .sw{fill:var(--ink)}
/* scene 1 colours the foreground so the two layers read apart even when stacked */
.fgc [fill="var(--ink)"]{fill:var(--accent)}
.fgc [stroke="var(--ink)"]{stroke:var(--accent)}
.t-cap{font-size:22px;fill:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.t-row{font-size:19px;font-weight:700;fill:var(--ink-2)}
.t-na{font-size:44px;font-weight:800;fill:#a3a7b0}
.t-city{font-size:17px;font-weight:800;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.drag{cursor:ns-resize;touch-action:none}
.mx{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:.3rem}
.mx .ch{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.15rem;font-size:.6rem;font-weight:700;letter-spacing:-.04em;white-space:nowrap;min-width:0}
.mx .ch svg,.mx .ch img{width:72%;aspect-ratio:1;object-fit:contain;display:block}
.mx .rh{display:flex;align-items:center;justify-content:flex-end;font-size:.72rem;font-weight:700;padding-right:.3rem;white-space:nowrap}
.cell{aspect-ratio:1;background:var(--paper);border:2px solid transparent;border-radius:.3rem;padding:0;display:grid;place-items:center;min-width:0;overflow:hidden}
.cell svg,.cell img{width:100%;height:100%;display:block;object-fit:contain}
.cell small{font-size:.55rem;color:#a3a7b0;font-weight:700;white-space:nowrap}
.cell.new{background:#f8f9fa}
.cell:hover{border-color:var(--rule)}
.cell[aria-pressed="true"]{border-color:var(--accent)}
.node{stroke:var(--paper);stroke-width:2}
.link{stroke:var(--ink-2);stroke-width:1.6}

/* phone and narrow windows: stack, and let the page scroll */
@media (max-width:760px){
  html{font-size:15px}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .top{flex-direction:column;gap:.2rem;padding:.7rem 1rem}
  .caption{font-size:1.2rem}
  .main{grid-template-columns:1fr}
  .stage{padding:.6rem .6rem .4rem}
  .svgbox{flex:none;aspect-ratio:1000/620}
  .foot{flex-direction:column;align-items:flex-start;padding:.6rem 1rem}
  .keys{display:none}
  .cover{grid-template-columns:1fr;padding:4.8rem 1.4rem 2rem;min-height:100svh;align-content:center}
  .cover .org{left:1.4rem;top:1.4rem}
  .cover h1{font-size:2.7rem}
  .cover .eq{font-size:1.15rem;margin-bottom:1.8rem}
  .drag{touch-action:auto;cursor:default}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="home" type="button" title="表紙へ">チャートの文法</button>
    <p class="caption" id="caption"></p>
  </header>

  <!-- 表紙 -->
  <main class="cover" data-scene="0">
    <p class="org">Visualizing.JP</p>
    <div>
      <h1>チャートの文法</h1>
      <p class="eq"><b>背景</b> ＋ <b>前景</b> ＝ <b>チャート</b></p>
      <button class="start" id="start" type="button">はじめる<kbd>Space</kbd></button>
    </div>
    <div class="art"><svg id="svg0" viewBox="0 50 660 420" role="img" aria-label="背景と前景、2枚のレイヤー"></svg></div>
  </main>

  <!-- 場面1：分ける -->
  <main class="main" data-scene="1" hidden>
    <section class="stage" aria-label="ステージ">
      <div class="svgbox"><svg id="svg1" class="drag" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="重なった2枚のレイヤー"></svg></div>
    </section>
    <aside class="panel" id="panel1">
      <div class="seg"><button class="act" id="act1" type="button"><svg viewBox="0 0 100 70" aria-hidden="true"></svg><span id="act1label">前景と背景に分ける</span></button></div>
      <div class="tiles" id="mode1">
        <button class="tile" type="button" data-mode="anime" aria-pressed="true"><svg viewBox="-170 -170 340 340" aria-hidden="true"></svg><span>アニメ</span></button>
        <button class="tile" type="button" data-mode="chart" aria-pressed="false"><svg viewBox="-170 -170 340 340" aria-hidden="true"></svg><span>チャート</span></button>
      </div>
      <p class="note" id="note1"></p>
    </aside>
  </main>

  <!-- 場面2：前景をつくる -->
  <main class="main" data-scene="2" hidden>
    <section class="stage" aria-label="ステージ">
      <div class="stagehead"><h2 id="name2"></h2><p id="sub2"></p></div>
      <div class="svgbox"><svg id="svg2" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="図形記号と知覚チャンネルの組み合わせ"></svg></div>
    </section>
    <aside class="panel" id="panel2">
      <div class="mx" id="mx2"></div>
      <p class="note" id="note2"></p>
    </aside>
  </main>

  <!-- 場面3：背景をえらぶ -->
  <main class="main" data-scene="3" hidden>
    <section class="stage" aria-label="ステージ">
      <div class="stagehead"><h2 id="name3"></h2><p id="sub3"></p></div>
      <div class="svgbox"><svg id="svg3" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="同じ点を4つの座標系に置く"></svg></div>
    </section>
    <aside class="panel" id="panel3">
      <div class="seg coord" id="sys3"></div>
      <p class="note" id="note3"></p>
    </aside>
  </main>

  <!-- 場面4：かさねる -->
  <main class="main" data-scene="4" hidden>
    <section class="stage" aria-label="ステージ">
      <div class="svgbox"><svg id="svg4" class="drag" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="背景と前景のレイヤー"></svg></div>
    </section>
    <aside class="panel" id="panel4">
      <div class="seg"><button class="act" id="act4" type="button"><svg viewBox="0 0 100 70" aria-hidden="true"></svg><span id="act4label">かさねる</span></button></div>
      <div id="tiles4"></div>
    </aside>
  </main>

  <!-- 場面5：背景だけ替える -->
  <main class="main" data-scene="5" hidden>
    <section class="stage" aria-label="ステージ">
      <div class="stagehead"><h2 id="name5"></h2><p id="sub5"></p></div>
      <div class="svgbox"><svg id="svg5" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="同じデータを、背景の座標系だけ替えて描く"></svg></div>
    </section>
    <aside class="panel" id="panel5">
      <div>
        <h3>データ</h3>
        <div class="seg" id="ds5">
          <button type="button" data-ds="night" aria-pressed="true">ナイチンゲール</button>
          <button type="button" data-ds="yogurt" aria-pressed="false">ヨーグルト</button>
        </div>
      </div>
      <div>
        <h3>背景</h3>
        <div class="seg coord" id="coord5">
          <button type="button" data-to="0" aria-pressed="true"><svg viewBox="-150 -150 300 300" aria-hidden="true"></svg><span id="bg5name">直交座標系</span><small id="bg5kana">たて・よこ</small></button>
          <button type="button" data-to="1" aria-pressed="false"><svg viewBox="-150 -150 300 300" data-bg="polar" aria-hidden="true"></svg>極座標系<small>むき・きょり</small></button>
        </div>
        <input type="range" id="scrub5" min="0" max="1000" value="0" aria-label="直交座標系から極座標系へ">
      </div>
      <div>
        <h3 id="lg5title"></h3>
        <ul class="legend" id="legend5"></ul>
      </div>
      <p class="note" id="note5"></p>
    </aside>
  </main>

  <footer class="foot">
    <ol class="steps" id="steps"></ol>
    <div class="keys"><span><kbd>←</kbd><kbd>→</kbd>場面</span><span><kbd>↑</kbd><kbd>↓</kbd><span id="kud"></span></span><span><kbd>Space</kbd><span id="ksp"></span></span></div>
  </footer>
</div>
<div id="tip" hidden></div>

const L = 125;

    S('circle', {cx: 0, cy: 0, r: thumb ? 13 * f : 5, fill: INK}, g);
    const A0 = 2 * Math.PI * .055, A1 = 2 * Math.PI * .155, rr = thumb ? .62 : .86, p0 = P(.055, rr), p1 = P(.155, rr), hw = thumb ? 22 * f : 9;

const dotAt = (g, P, u, v, r) => { const p = P(u, v); S('circle', {cx: f1(p[0]), cy: f1(p[1]), r, fill: INK}, g); };

  bar(g, P) { const v = [.35, .6, .5, .82, .62, .42, .25], b = .8 / 7; v.forEach((h, i) => rect(g, P, .12 + i * b + b * .12, .12 + (i + 1) * b - b * .12, 0, h)); },

/* 2枚のレイヤーを重ねたり、分けたりするステージ（場面1と場面4で共用）。k=1 が、分けた状態。 */
/* 「分ける／かさねる」ボタンの絵と文言。k>.5（いま分かれている）なら、次の操作は「かさねる」 */
const ACT = {};
function setAct(id, k, labels) {
  let a = ACT[id];
  if (!a) {
    const svg = $('#' + id + ' svg'), at = {stroke: '#fff', 'stroke-width': 2, 'stroke-linejoin': 'round'};
    a = ACT[id] = {b: S('polygon', {fill: 'rgba(255,255,255,.35)', ...at}, svg), t: S('polygon', {fill: 'rgba(255,255,255,.92)', ...at}, svg), mode: null};
  }
  const mode = k > .5 ? 'stack' : 'split';
  if (mode === a.mode) return;
  a.mode = mode;
  const pts = y => `22,${y + 9} 62,${y + 9} 78,${y - 9} 38,${y - 9}`, d = mode === 'split' ? 15 : 3;
  a.b.setAttribute('points', pts(35 + d)); a.t.setAttribute('points', pts(35 - d));
  $('#' + id + 'label').textContent = labels[mode === 'stack' ? 0 : 1];
}
function layerStage(svg, onK, opt) {
  const CX = 360, CY = 310, HS = 165, LX = 690;
  const gBg = S('g', {class: 'layer'}, svg), gFg = S('g', {class: 'layer'}, svg);
  S('rect', {x: -HS, y: -HS, width: 2 * HS, height: 2 * HS, rx: 8, fill: 'var(--paper)', stroke: 'var(--rule)'}, gBg);
  const fgSheet = S('rect', {x: -HS, y: -HS, width: 2 * HS, height: 2 * HS, rx: 8, fill: 'var(--paper)', stroke: 'var(--rule)'}, gFg);
  const bg = S('g', null, gBg), fg = S('g', null, gFg);
  const gLab = S('g', opt && opt.plain ? {display: 'none'} : null, svg), gRes = S('g', null, svg);
  S('text', {x: LX, y: 180, class: 't-tag'}, gLab).textContent = '前景';
  const tFg = S('text', {x: LX, y: 220, class: 't-big'}, gLab), tFgSub = S('text', {x: LX, y: 248, class: 't-sub'}, gLab);
  S('text', {x: LX, y: 322, class: 't-op'}, gLab).textContent = '＋';
  S('text', {x: LX, y: 404, class: 't-tag'}, gLab).textContent = '背景';
  const tBg = S('text', {x: LX, y: 444, class: 't-big'}, gLab), tBgSub = S('text', {x: LX, y: 472, class: 't-sub'}, gLab);
  S('text', {x: 560, y: 321, class: 't-op'}, gRes).textContent = '＝';
  const tRes = S('text', {x: 606, y: 321, class: 't-res'}, gRes);
  function render(k) {
    const sk = (-.72 * k).toFixed(4), sy = (1 - .5 * k).toFixed(4), dy = 112 * k;
    gBg.setAttribute('transform', `matrix(1 0 ${sk} ${sy} ${CX} ${f1(CY + dy)})`);
    gFg.setAttribute('transform', `matrix(1 0 ${sk} ${sy} ${CX} ${f1(CY - dy)})`);
    fgSheet.setAttribute('opacity', (.85 * k).toFixed(3));
    gLab.setAttribute('opacity', c01(k * 2 - 1).toFixed(3));
    gRes.setAttribute('opacity', c01(1 - k * 3).toFixed(3));
  }
  const K = tweener(k => { render(k); if (onK) onK(k); }, 1);
  /* 上にドラッグすると分かれ、下にドラッグすると重なる */
  let drag = null;
  const narrow = matchMedia('(max-width:760px)');
  svg.addEventListener('pointerdown', e => { if (narrow.matches && e.pointerType !== 'mouse') return; drag = {y: e.clientY, k: K.value, moved: false}; try { svg.setPointerCapture(e.pointerId); } catch (err) {} });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = drag.y - e.clientY;
    if (Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) K.set(c01(drag.k + dy / (svg.clientHeight * .28)));
  });
  const end = () => { if (!drag) return; const d = drag; drag = null; if (d.moved) K.to(K.value > .5 ? 1 : 0, 350); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  K.set(1);
  return {
    bg, fg, K,
    set(o) { tFg.textContent = o.fg || ''; tFgSub.textContent = o.fgSub || ''; tBg.textContent = o.bg || ''; tBgSub.textContent = o.bgSub || ''; tRes.textContent = o.res || ''; gRes.setAttribute('visibility', o.res ? 'visible' : 'hidden'); }
  };
}

/* ==========================================================
   場面5：背景だけ替える
   横軸を曲げていき、最後に1点にたたむ。t=0 が直交（ヨーグルトでは平行）、t=1 が極。
   ========================================================== */
function bender(g, t) {
  const tt = Math.max(t, 1e-4), th = 2 * Math.PI * tt, rho = g.W * (1 - tt) / th;
  const e = 1 - (1 - t) * (1 - t);
  const uc = lerp(.5, g.uc1, t);
  const cx = lerp(g.x0 + g.W / 2, g.cx1, t) + (g.spread || 0) * Math.sin(Math.PI * t);
  const yb = lerp(g.yb0, g.yb1, e) - (g.lift || 0) * Math.sin(Math.PI * t * t * t);
  return {
    H: lerp(g.Hc, g.R, t),
    pt(u, h) { const ph = (u - uc) * th; return [cx + (rho + h) * Math.sin(ph), yb + rho - (rho + h) * Math.cos(ph)]; }
  };
}
const P2 = p => f1(p[0]) + ',' + f1(p[1]);
function bandPath(B, u0, u1, h0, h1, n) {
  const a = [];
  for (let i = 0; i <= n; i++) a.push(P2(B.pt(lerp(u0, u1, i / n), h0)));
  for (let i = n; i >= 0; i--) a.push(P2(B.pt(lerp(u0, u1, i / n), h1)));
  return 'M' + a.join('L') + 'Z';
}
function arcPath(B, u0, u1, h, n) {
  const a = [];
  for (let i = 0; i <= n; i++) a.push(P2(B.pt(lerp(u0, u1, i / n), h)));
  return 'M' + a.join('L');
}

const svg5 = $('#svg5');
const gNight = S('g', null, svg5), gYog = S('g', {visibility: 'hidden'}, svg5);

/* ---- ナイチンゲール ---- */
const night = (() => {
  const rows = $('#data-nightingale').textContent.trim().split(/\r?\n/).slice(1).map(l => { const c = l.split(','); return {date: c[0], disease: +c[1], wounds: +c[2], other: +c[3]}; });
  const geoms = [
    {x0: 90,  W: 430, yb0: 520, yb1: 270, cx1: 310, uc1: .25, Hc: 420, R: 300, spread: -150},
    {x0: 520, W: 430, yb0: 520, yb1: 270, cx1: 740, uc1: .25, Hc: 420, R: 300, spread: 50}
  ];
  const groups = [];
  const gRing = S('g', null, gNight), gW = S('g', null, gNight), gB = S('g', null, gNight), gT = S('g', null, gNight);
  for (let gi = 0; gi * 12 < rows.length && gi < geoms.length; gi++) {
    const ms = rows.slice(gi * 12, gi * 12 + 12);
    const G = {geom: geoms[gi], months: [], rings: [], base: S('path', {class: 'base'}, gB)};
    NIGHT_RINGS.forEach(v => G.rings.push({v, el: S('path', {class: 'ring'}, gRing), lab: gi === 0 ? S('text', {class: 't-ax', 'text-anchor': 'end'}, gT) : null}));
    G.rings.forEach(r => { if (r.lab) r.lab.textContent = num(r.v) + '人'; });
    ms.forEach((m, i) => {
      const [y, mo] = m.date.split('-').map(Number);
      const parts = CAUSES.map(c => ({c, v: m[c.key]})).filter(p => p.v > 0).sort((a, b) => b.v - a.v);
      const M = {i, n: ms.length, max: Math.max(...parts.map(p => p.v), 0), parts: [], lab: S('text', {class: 't-ax', 'text-anchor': 'middle', 'dominant-baseline': 'central'}, gT)};
      M.lab.textContent = mo;
      parts.forEach(p => {
        const el = S('path', {class: 'wedge', fill: p.c.color}, gW);
        const lines = [`${y}年${mo}月`, `${p.c.label}　${num(p.v)}人`];
        el.addEventListener('pointerenter', e => showTip(e, lines));
        el.addEventListener('pointermove', moveTip);
        el.addEventListener('pointerleave', hideTip);
        M.parts.push({v: p.v, el});
      });
      G.months.push(M);
    });
    const a = ms[0].date.split('-').map(Number), b = ms[ms.length - 1].date.split('-').map(Number);
    G.cap = S('text', {class: 't-ax', 'text-anchor': 'middle'}, gT);
    G.cap.textContent = `${a[0]}年${a[1]}月〜${b[0]}年${b[1]}月`;
    groups.push(G);
  }
  function render(t) {
    const pw = lerp(1, .5, t), fade = Math.pow(Math.abs(2 * t - 1), 1.5).toFixed(3);
    for (const G of groups) {
      const B = bender(G.geom, t), hOf = v => B.H * Math.pow(v / NIGHT_MAX, pw);
      for (const M of G.months) {
        const ins = lerp(.1, 0, t) / M.n, u0 = M.i / M.n + ins, u1 = (M.i + 1) / M.n - ins;
        for (const p of M.parts) p.el.setAttribute('d', bandPath(B, u0, u1, 0, hOf(p.v), 8));
        const lp = B.pt((M.i + .5) / M.n, lerp(-20, Math.max(hOf(M.max) + 16, 46), t));
        M.lab.setAttribute('x', f1(lp[0])); M.lab.setAttribute('y', f1(lp[1])); M.lab.setAttribute('opacity', fade);
      }
      for (const r of G.rings) {
        r.el.setAttribute('d', arcPath(B, 0, 1, hOf(r.v), 72));

  const dotted = (g, d) => S('path', {d, fill: 'none', stroke: SOFT, 'stroke-width': 1.4, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round'}, g);
  const lab = (g, x, y, t, anchor) => { S('text', {x, y, class: 't-row', 'text-anchor': anchor || 'start'}, g).textContent = t; };
  /* 直交 */
  let g = bgEl.cart = S('g', null, svg3);
  for (let lo = -120; lo <= 180; lo += 60) dotted(g, `M${P2(PROJ.cart(lo, -90))}L${P2(PROJ.cart(lo, 90))}`);
  for (let la = -60; la <= 90; la += 30) dotted(g, `M${P2(PROJ.cart(-180, la))}L${P2(PROJ.cart(180, la))}`);
  arrow(g, [BOX3.x0, BOX3.y0], [BOX3.x1 + 26, BOX3.y0], 3, INK); arrow(g, [BOX3.x0, BOX3.y0], [BOX3.x0, BOX3.y1 - 26], 3, INK);
  lab(g, BOX3.x1 + 30, BOX3.y0 + 34, '経度', 'end'); lab(g, BOX3.x0 + 16, BOX3.y1 - 30, '緯度');
  /* 極 */
  g = bgEl.polar = S('g', {opacity: 0}, svg3);
  for (let la = 60; la >= -90; la -= 30) S('circle', {cx: PC[0], cy: PC[1], r: f1((90 - la) / 180 * PR), fill: 'none', stroke: SOFT, 'stroke-width': 1.4, 'stroke-dasharray': '2 5'}, g);
  for (let lo = 0; lo < 360; lo += 30) dotted(g, `M${PC}L${P2(PROJ.polar(lo, -90))}`);
  arrow(g, PC, [PC[0], PC[1] - PR - 24], 3, INK);
  S('circle', {cx: PC[0], cy: PC[1], r: 5, fill: INK}, g);
  const ra = PR + 14, A0 = 8 * RAD, A1 = 30 * RAD, pa = a => [PC[0] + ra * Math.sin(a), PC[1] - ra * Math.cos(a)];
  S('path', {d: `M${P2(pa(A0))}A${ra},${ra} 0 0 1 ${P2(pa(A1))}`, fill: 'none', stroke: INK, 'stroke-width': 2.5}, g);
  head(g, pa(A1)[0], pa(A1)[1], A1, 10, INK); head(g, pa(A0)[0], pa(A0)[1], A0 + Math.PI, 10, INK);
  lab(g, PC[0] - 14, PC[1] - PR - 10, '北極からの距離', 'end'); lab(g, pa(A1)[0] + 16, pa(A1)[1] + 4, '経度'); lab(g, PC[0] + 10, PC[1] + 22, '北極');
  /* 地理 */
  g = bgEl.geo = S('g', {opacity: 0}, svg3);
  const rim = []; for (let la = -90; la <= 90; la += 5) rim.push(P2(PROJ.geo(180, la))); for (let la = 90; la >= -90; la -= 5) rim.push(P2(PROJ.geo(-180, la)));
  S('path', {d: 'M' + rim.join('L') + 'Z', fill: '#f7f8f9', stroke: 'var(--rule)'}, g);
  S('path', {d: LAND_D, fill: '#d3d6db'}, g);
  /* ネットワーク（線は点といっしょに動かす） */
  bgEl.net = S('g', {opacity: 0}, svg3);
})();
const links3 = EDGES.map(() => S('line', {class: 'link'}, bgEl.net));
const gN3 = S('g', null, svg3);
const nodes3 = CITIES.map((c, i) => {
  const el = S('circle', {class: 'node', r: i === FOCUS ? 10 : 7.5, fill: i === FOCUS ? 'var(--pink)' : INK}, gN3);
  const ew = c[1] < 0 ? '西経' : '東経', ns = c[2] < 0 ? '南緯' : '北緯', lines = [c[0], `${ew} ${Math.abs(c[1])}°　${ns} ${Math.abs(c[2])}°`];
  el.addEventListener('pointerenter', e => showTip(e, lines)); el.addEventListener('pointermove', moveTip); el.addEventListener('pointerleave', hideTip);
  return el;
});
const focusLab = S('text', {class: 't-city'}, gN3); focusLab.textContent = CITIES[FOCUS][0];
gN3.appendChild(nodes3[FOCUS]);
const st3 = {i: 0, from: null, o0: null};
let cur3 = POS.cart.map(p => p.slice());
const op3 = {cart: 1, polar: 0, geo: 0, net: 0};
function paint3() {
  nodes3.forEach((el, i) => { el.setAttribute('cx', f1(cur3[i][0])); el.setAttribute('cy', f1(cur3[i][1])); });
  focusLab.setAttribute('x', f1(cur3[FOCUS][0] + 14)); focusLab.setAttribute('y', f1(cur3[FOCUS][1] - 10));
  EDGES.forEach(([a, b], j) => { const l = links3[j]; l.setAttribute('x1', f1(cur3[a][0])); l.setAttribute('y1', f1(cur3[a][1])); l.setAttribute('x2', f1(cur3[b][0])); l.setAttribute('y2', f1(cur3[b][1])); });
}
const P3 = tweener(p => {
  const to = POS[SYS[st3.i].k];
  cur3 = st3.from.map((a, j) => [lerp(a[0], to[j][0], p), lerp(a[1], to[j][1], p)]);
  for (const s of SYS) { op3[s.k] = lerp(st3.o0[s.k], s.k === SYS[st3.i].k ? 1 : 0, p); bgEl[s.k].setAttribute('opacity', op3[s.k].toFixed(3)); }
  paint3();
}, 1);
const sysBtns = SYS.map((s, i) => {
  const b = H('button', {type: 'button'}, $('#sys3')), ic = S('svg', {viewBox: '-150 -150 300 300', 'aria-hidden': 'true'}, b);
  if (s.k === 'cart' || s.k === 'polar') drawBg(s.k, ic, true);
  else if (s.k === 'geo') S('path', {d: LAND_D, fill: '#9aa0aa', transform: 'scale(.37) translate(-500 -310)'}, ic);
  else { const N = [[-90, -60], [20, -95], [95, -10], [-20, 20], [-70, 90], [70, 85]], E = [[0, 1], [1, 2], [0, 3], [3, 2], [3, 4], [3, 5]]; E.forEach(([a, c]) => S('line', {x1: N[a][0], y1: N[a][1], x2: N[c][0], y2: N[c][1], stroke: INK, 'stroke-width': 7}, ic)); N.forEach(p => S('circle', {cx: p[0], cy: p[1], r: 17, fill: INK}, ic)); }
  b.appendChild(document.createTextNode(s.name)); H('small', {textContent: s.kana}, b);
  b.addEventListener('click', () => setSys(i));
  return b;
});
function setSys(i) {
  st3.i = (i + SYS.length) % SYS.length;
  st3.from = cur3.map(p => p.slice()); st3.o0 = {...op3};
  const s = SYS[st3.i];
  $('#name3').textContent = s.name; $('#sub3').textContent = s.sub;
  sysBtns.forEach((b, j) => b.setAttribute('aria-pressed', String(j === st3.i)));
  hideTip();
  P3.set(0); P3.to(1, 1500);
}
$('#note3').textContent = `点は世界の${CITIES.length}都市。ピンクが${CITIES[FOCUS][0]}。`;

/* ==========================================================
   場面の切り替えとキー操作
   ========================================================== */
const SCENES = [
  {n: 0, label: '表紙',           caption: '', ud: '', sp: 'はじめる'},
  {n: 1, label: '分ける',         caption: '一枚に見える絵も、前景と背景が重なってできている。',   ud: '題材',       sp: '分ける'},
  {n: 2, label: '前景をつくる',   caption: '前景は、図形記号と知覚チャンネルのかけ算。', ud: 'チャンネル', sp: '図形記号'},
  {n: 3, label: '背景をえらぶ',   caption: '背景がかわると、位置の意味がかわる。',     ud: '座標系',     sp: 'つぎへ'},
  {n: 4, label: 'かさねる',       caption: '背景に前景をかさねると、チャートになる。', ud: 'チャート',   sp: 'かさねる'},
  {n: 5, label: '背景だけ替える', caption: 'データも図形もそのまま。背景だけ替える。', ud: 'データ',     sp: '背景を替える'}
];
const READY = SCENES.map(s => s.n);
let scene = 0;
const stepBtns = {};
SCENES.forEach(s => {
  if (!s.n) return;
  const li = H('li', null, $('#steps')), b = H('button', {type: 'button'}, li);
  H('b', {textContent: s.n}, b); H('span', {textContent: s.label}, b);
  b.addEventListener('click', () => setScene(s.n));
  stepBtns[s.n] = b;
});
function setScene(n, fromHash) {
  if (!READY.includes(n)) return;
  scene = n;
  $$('[data-scene]').forEach(m => m.hidden = +m.dataset.scene !== n);
  const s = SCENES.find(x => x.n === n), cap = $('#caption');
  $('.app').classList.toggle('is-cover', n === 0);
  cap.replaceChildren(H('span', {className: 'no', textContent: n}), document.createTextNode(s.caption));
  $('#kud').textContent = s.ud; $('#ksp').textContent = s.sp;
  for (const k in stepBtns) { if (+k === n) stepBtns[k].setAttribute('aria-current', 'step'); else stepBtns[k].removeAttribute('aria-current'); }
  hideTip();
  if (n === 2 && st2.row === 5 && !raf2 && !reduce) { st2.t0 = performance.now(); raf2 = requestAnimationFrame(loop2); }
  if (!fromHash) { try { history.replaceState(null, '', '#scene-' + n); } catch (e) { location.hash = 'scene-' + n; } }
}
function fromHash() { const m = /^#scene-(\d)$/.exec(location.hash); setScene(m && READY.includes(+m[1]) ? +m[1] : 0, true); }
addEventListener('hashchange', fromHash);

const SPACE = {0: () => setScene(1), 1: () => toggle1(), 2: () => select2(st2.col + 1, st2.row), 3: () => setSys(st3.i + 1), 4: () => toggle4(), 5: () => toggle5()};
const UPDOWN = {
  0: () => {},
  1: () => setMode1(st1.mode === 'anime' ? 'chart' : 'anime'),
  2: d => select2(st2.col, st2.row + d),
  3: d => setSys(st3.i + d),
  4: d => setRecipe(st4.i + d),
  5: () => setDs(st5.ds === 'night' ? 'yogurt' : 'night')
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onRange = e.target instanceof HTMLInputElement && e.target.type === 'range';
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') { e.preventDefault(); if (!e.repeat) SPACE[scene](); return; }
  if (onRange) return;
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    e.preventDefault();
    const i = READY.indexOf(scene) + (k === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < READY.length) setScene(READY[i]);
  } else if (k === 'ArrowDown' || k === 'ArrowUp') {
    e.preventDefault();
    UPDOWN[scene](k === 'ArrowDown' ? 1 : -1);
  }
});
/* Space on a focused button would also fire its click; swallow that so it only acts once. */
addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Spacebar') && e.target instanceof HTMLButtonElement) e.preventDefault(); });

(function buildCover() {
  const svg = $('#svg0');
  const layer = (cy, cls) => { const f = S('g', {class: 'float' + cls}, svg), g = S('g', {transform: `matrix(1 0 -.72 .5 330 ${cy})`}, f); S('rect', {x: -165, y: -165, width: 330, height: 330, rx: 8, class: 'sheet'}, g); return g; };
  drawBg('cart', layer(350, ' b'), false);
  FG.scatter(S('g', {class: 'cfg'}, layer(170, '')), CO.cart);
})();
$('#start').addEventListener('click', () => setScene(1));
$('#home').addEventListener('click', () => setScene(0));

setMode1('anime'); LS1.K.set(0);
select2(0, 0);
setSys(0);
setRecipe(0);
setDs('night');
fromHash();
window.__app = {setScene, setMode1, K1: LS1.K, select2, E2, setSys, P3, setRecipe, K4: LS4.K, T5, setDs};

})();
</script>
